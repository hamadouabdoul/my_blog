{% extends "blog/base.html" %}
{% load static %}

{% block title %} Blog {% endblock %}

{% block content %}
<h1>Tous les articles</h1>
<div>
    {% for poste in postes %}
    <a href="{% url 'poste' poste.slug %}">
        <div>
            <div><img src="{{ poste.image.url }}" alt="image du blog"></div>
            <div>{{ poste.title }} </div>
            <p>{{ poste.created_at }} </p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
