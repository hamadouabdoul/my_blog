{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
</head>
<body>
    <nav>
        <img src="{% static 'images/logo.png' %}" alt="logo Wahid Dev">
        <ul>
            <li><a href="#">Acceuil</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">À propos</a></li>
            <li><a href="#">Avis</a></li>
        </ul>
    </nav>

    {% block content %} {% endblock %}

    <footer class="border-t border-wisteria/10 bg-purple-dark/60 backdrop-blur-sm mt-20">
        <div class="max-w-6xl mx-auto px-6 md:px-12 py-12 flex flex-col md:flex-row gap-10 md:gap-0 justify-between items-start">

            <!-- Colonne 1 : Navigation footer -->
            <div>
                <p class="text-xs uppercase tracking-widest text-wisteria/50 mb-4">Navigation</p>
                <ul class="flex flex-col gap-2">
                    <li><a href=""           class="text-wisteria/70 hover:text-sunglow text-sm" id="footer-home">Home</a></li>
                    <li><a href="" class="text-wisteria/70 hover:text-sunglow text-sm" id="footer-convertir">Convertir</a></li>
                    <li><a href="#"                           class="text-wisteria/70 hover:text-sunglow text-sm" id="footer-apropos">À propos</a></li>
                </ul>
            </div>

            <!-- Colonne 2 : Infos créateur + réseaux -->
            <div class="flex flex-col gap-4">
                <p class="font-display text-lg font-bold text-white">By <span class="text-sunglow">Wahid DEV</span></p>

                <!-- Lien YouTube avec vrai icone SVG -->
                <a href="https://www.youtube.com/channel/UCudwCwO6e7dnKPf5Yb-IzTQ"
                   target="_blank" rel="noopener"
                   class="flex items-center gap-3 text-wisteria/70 hover:text-red-400 transition-colors text-sm"
                   id="footer-youtube">
                    <!-- Icone YouTube SVG -->
                    <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    Abonne-toi à la chaîne
                </a>

                <!-- Lien WhatsApp avec vrai icone SVG -->
                <a href="https://wa.me/+22791334383"
                   target="_blank" rel="noopener"
                   class="flex items-center gap-3 text-wisteria/70 hover:text-green-400 transition-colors text-sm"
                   id="footer-whatsapp">
                    <!-- Icone WhatsApp SVG -->
                    <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    +227 91 33 43 83
                </a>
            </div>
        </div>

    </footer>
</body>
</html>
